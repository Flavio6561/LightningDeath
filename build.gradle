plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.8.10"
}

minecraft_version = project.minecraft_version
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "lightningdeath" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "UDVSgNWY"
    versionNumber = "${project.version}"
    versionName = "Lightning Death ${project.version}"
    changelog = "[Version ${project.version}](https://github.com/Flavio6561/LightningDeath/wiki/Version-changelogs)"
    uploadFile = jar
    versionType = "release"
    gameVersions = ["26.1", "26.1.1", "26.1.2"]
    loaders = ["fabric", "quilt"]

    dependencies {
        required.project "P7dR8mSH"
    }
}

tasks.modrinth.dependsOn(tasks.jar)